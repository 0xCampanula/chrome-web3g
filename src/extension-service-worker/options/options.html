<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Chrome web3</title>
<link href="/options/bootstrap.css" rel="stylesheet" />
<link href="/options/options.css" rel="stylesheet" />
</head>
<body>
<script src="/options/jquery.raw.js"></script>
<script src="/options/bootstrap.raw.js"></script>
<script src="/options/options.js"></script>

<div id="ethereum-logo">
	<img class="logo" src="/options/ethereum.svg" alt="Ethereum" />
</div>

<div id="chain-configs" class="card preflight">
	<div class="card-body action">
		<form method="POST" action="#">
			<h2>区块链RPC节点配置</h2>
			<p>
				浏览器通过RPC节点访问区块链数据。你可以使用公共RPC节点，或以更私密、可验证的方式运行自己的RPC节点。每个区块链只使用一个RPC节点：点击右侧RPC节点以切换RPC节点，也可通过"+"添加自定义RPC节点。
			</p>
			<table>
				<thead>
					<th scope="col" class="column-chain">区块链</th>
					<th scope="col" class="column-configured-providers">已配置RPC节点</th>
					<th scope="col" class="column-public-providers">
						<span>RPC节点列表</span>
						<button class="btn btn-success rpc-endpoints-use-public">自动配置</button>
					</th>
				</thead>
				<tbody id="chain-configs-tbody">
				</tbody>
			</table>
			<div class="add-custom-chain">
				<h3>添加自定义区块链</h3>
				<div class="add-custom-chain-form">
					<input id="custom-chain-id" type="number" min="1" class="form-control" placeholder="链 ID（例如 3334）" />
					<input id="custom-chain-name" type="text" class="form-control" placeholder="名称（可选）" />
					<input id="custom-chain-rpc" type="text" class="form-control" placeholder="https://rpc.example.com" />
					<button id="add-custom-chain-btn" class="btn btn-primary">添加</button>
				</div>
				<span id="add-custom-chain-error" class="add-provider-error"></span>
			</div>
		</form>
	</div>
</div>
</body>
</html>
